# CI + release for eid-circuits (same shape as csca-registry and the psonet
# libraries).
#
#   noir ──┐
#   rust ──┼─> ci ──> tag (cog, push:main) ──> github-release
#   typos ─┤
#   supply-chain
#
#   circuit-size, coverage   reports only (PR comments), outside `ci`
#
# Triggers
#   push:main         full pipeline incl. cog auto-bump and, when cog tagged, release
#   push:tags:["v*"]  release-only path against the named tag
#   pull_request      checks + commitlint (any base branch, so stacked PRs are checked)
#   schedule          nightly supply-chain (fresh advisories)
#   workflow_dispatch maintainer-named (re-)release; empty `tag` runs the main pipeline
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Every pull request, including ones stacked on another feature branch.
  pull_request:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Existing tag to (re-)release (e.g. "v0.2.0"). Empty input runs the
          normal main pipeline.
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  resolve:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.r.outputs.release_tag }}
    steps:
      - id: r
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag=""
          case "$EVENT" in
            push)
              if [[ "$REF" == refs/tags/v* ]]; then
                tag="$REF_NAME"
              fi
              ;;
            workflow_dispatch)
              tag="$INPUT_TAG"
              ;;
          esac
          echo "release_tag=${tag}"
          echo "release_tag=${tag}" >> "$GITHUB_OUTPUT"

  commitlint:
    name: Commit lint (conventional-commits)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: wagoid/commitlint-github-action@v6

  noir:
    name: Noir (fmt + test)
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.release_tag == '' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Cache the Noir toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: noir-toolchain-${{ hashFiles('mise.toml') }}
      - name: Install nargo + bb at the pinned versions
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: mise run install:zk-toolchain
      - run: echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - name: nargo fmt --check
        run: nargo fmt --check
      - name: nargo test
        run: nargo test

  rust:
    name: Rust tools (fmt, clippy, test, vector drift)
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.release_tag == '' && github.event_name != 'schedule'
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: rustfmt, clippy
          rust-src-dir: rust
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: clippy (pso-poseidon code-smell set)
        run: |
          cargo clippy --all-targets --all-features -- -D warnings \
            -D clippy::dbg_macro -D clippy::print_stdout -D clippy::print_stderr \
            -D clippy::todo -D clippy::unimplemented -D clippy::exit \
            -D clippy::cast_lossless -D clippy::cast_possible_truncation \
            -D clippy::cast_possible_wrap -D clippy::cast_precision_loss \
            -D clippy::cast_sign_loss -D clippy::clone_on_ref_ptr \
            -D clippy::empty_enums -D clippy::enum_glob_use -D clippy::if_not_else \
            -D clippy::mut_mut -D clippy::non_ascii_literal -D clippy::single_match_else \
            -D clippy::string_add -D clippy::string_add_assign \
            -D clippy::string_lit_as_bytes -D clippy::unnecessary_unwrap \
            -D clippy::unused_self -D clippy::useless_let_if_seq \
            -A clippy::module_name_repetitions -A clippy::must_use_candidate \
            -A clippy::missing_errors_doc -A clippy::missing_panics_doc \
            -A clippy::too_many_lines -A clippy::similar_names -A clippy::inline_always \
            -A clippy::unwrap_used -A clippy::expect_used -A clippy::panic
      - name: cargo test
        run: cargo test --all-features
      - name: Generated Noir files are current
        run: |
          set -euo pipefail
          for what in rsa ecdsa curves der steps circuits costs; do
            cargo run -q -p eid-vectors -- "$what" --check
          done

  # Every step circuit with a real-certificate Prover.toml is executed: the
  # whole statement (parsing, registry, revocation, hash, signature) holds for
  # one real certificate per signing configuration.
  circuit-samples:
    name: Circuit samples (nargo execute)
    runs-on: ubuntu-latest
    needs: [resolve]
    if: needs.resolve.outputs.release_tag == '' && github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Cache the Noir toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: noir-toolchain-${{ hashFiles('mise.toml') }}
      - name: Install nargo + bb at the pinned versions
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: mise run install:zk-toolchain
      - run: echo "$HOME/.nargo/bin" >> "$GITHUB_PATH"
      - name: Execute every sample
        run: |
          set -euo pipefail
          find noir/circuits -name Prover.toml -print0 \
            | xargs -0 -n1 dirname \
            | xargs -I{} sed -n 's/^name = "\(.*\)"/\1/p' {}/Nargo.toml \
            | sort > samples.txt
          echo "$(wc -l < samples.txt) samples"
          xargs -P 2 -I{} sh -c 'nargo execute --package {} > /dev/null && echo "ok {}"' < samples.txt

  # Which parts of the tree moved; circuit-size only runs when circuits did.
  changes:
    name: path filter
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    # paths-filter lists the pull request's files through the API.
    permissions:
      contents: read
      pull-requests: read
    outputs:
      circuits: ${{ steps.filter.outputs.circuits }}
    steps:
      - uses: actions/checkout@v5
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            circuits:
              - 'noir/**'
              - 'Nargo.toml'
              - 'mise.toml'
              # A change to how sizes are measured should also produce a
              # comparison, not silently skip one.
              - '.github/scripts/circuit_sizes.py'

  # Circuit size against the pull request's base (ported from
  # pso-zk-circuits). Gate count drives proving time, memory and the VK;
  # opcodes drive witness generation. Neither shows in a diff, so this measures
  # every bin circuit (the per-signature-type benchmarks and, later, the step
  # circuits) and comments. Reports, never gates: outside `ci`'s needs.
  circuit-size:
    name: circuit size
    runs-on: ubuntu-latest
    needs: [resolve, changes]
    if: >
      github.event_name == 'pull_request' &&
      needs.resolve.outputs.release_tag == '' &&
      needs.changes.outputs.circuits == 'true'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
      # The base as the pull request targets it, measured with the same toolchain.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: jdx/mise-action@v4
        with:
          install: false
      - name: Cache the Noir toolchain
        id: toolchain-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.nargo
            ~/.bb
          key: noir-toolchain-${{ hashFiles('mise.toml') }}
      - name: Install nargo + bb at the pinned versions
        if: steps.toolchain-cache.outputs.cache-hit != 'true'
        run: mise run install:zk-toolchain
      - name: Cache the bb CRS
        uses: actions/cache@v4
        with:
          path: ~/.bb-crs
          key: bb-crs-${{ hashFiles('mise.toml') }}
      - name: Measure this branch
        run: |
          python3 .github/scripts/circuit_sizes.py collect . \
            --nargo "$HOME/.nargo/bin/nargo" --bb "$HOME/.bb/bb" \
            -o head-sizes.json
      # The base is measured with the HEAD copy of the script, so a change to
      # the measurement itself cannot read as a change in the circuits.
      - name: Measure the base
        run: |
          python3 .github/scripts/circuit_sizes.py collect base \
            --nargo "$HOME/.nargo/bin/nargo" --bb "$HOME/.bb/bb" \
            -o base-sizes.json
      - name: Render the comparison
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          python3 .github/scripts/circuit_sizes.py report \
            base-sizes.json head-sizes.json --base-ref "$BASE_REF" > circuit-size.md
          cat circuit-size.md >> "$GITHUB_STEP_SUMMARY"
      - name: Circuit size PR comment
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: circuit-size
          path: circuit-size.md
      - uses: actions/upload-artifact@v5
        with:
          name: circuit-sizes
          path: |
            base-sizes.json
            head-sizes.json
            circuit-size.md
          retention-days: 14

  # Coverage of the Rust tools (ported from pso-zk-circuits). Reported, never
  # enforced, and outside `ci`'s needs so it cannot hold up a merge. Noir has
  # no coverage tooling; circuit behaviour is covered by the real-certificate
  # vectors and negative tests in each library.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
          rust-src-dir: rust
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-nextest
      - run: cargo llvm-cov nextest --workspace --profile ci --lcov --output-path lcov.info
      # `--summary-only` prints a fixed-width terminal table; render the JSON instead.
      - name: Render coverage report
        run: |
          cargo llvm-cov report --json --summary-only --output-path coverage.json
          python3 ../.github/scripts/coverage_report.py coverage.json > coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Coverage PR comment
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: coverage
          path: rust/coverage.md
      - uses: actions/upload-artifact@v5
        with:
          name: coverage
          path: |
            rust/lcov.info
            rust/coverage.json
            rust/coverage.md
          retention-days: 14

  typos:
    name: typos
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v5
      - uses: crate-ci/typos@v1.50.2
        with:
          config: ./typos.toml

  supply-chain:
    name: supply chain
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - name: cargo deny
        run: cargo deny --all-features check all
      - name: cargo audit
        run: cargo audit

  ci:
    name: ci
    runs-on: ubuntu-latest
    if: always()
    needs: [noir, rust, circuit-samples, typos, supply-chain]
    steps:
      - name: Check dependency results
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo "$RESULTS" | jq -e 'any(.[]; .result == "failure" or .result == "cancelled")' > /dev/null; then
            echo "::error::one or more required jobs did not succeed"
            exit 1
          fi

  # always() + an explicit ci check: a skipped ancestor (commitlint on push)
  # would otherwise skip this job and every release after it.
  tag:
    name: Bump version & tag
    runs-on: ubuntu-latest
    needs: [resolve, ci]
    if: |
      always() &&
      needs.ci.result == 'success' &&
      needs.resolve.outputs.release_tag == '' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      !startsWith(github.event.head_commit.message, 'chore(version):') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          rust-src-dir: rust
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Cocogitto bump
        uses: cocogitto/cocogitto-action@v4
        with:
          command: bump
          args: --auto
          git-user: "github-actions[bot]"
          git-user-email: "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Resolve created tag (if any)
        id: bump
        run: |
          set -euo pipefail
          tag="$(git tag --points-at HEAD | grep '^v' | head -n1 || true)"
          echo "tag=${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  github-release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: [resolve, tag]
    if: |
      always() &&
      ((needs.tag.result == 'success' && needs.tag.outputs.tag != '') ||
       needs.resolve.outputs.release_tag != '')
    steps:
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}
          name: ${{ needs.tag.outputs.tag || needs.resolve.outputs.release_tag }}
          generate_release_notes: true
