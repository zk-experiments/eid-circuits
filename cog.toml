tag_prefix = "v"
branch_whitelist = ["main"]
ignore_merge_commits = true
generate_mono_repository_global_tag = false

# The repository version lives in rust/Cargo.toml [workspace.package]; the
# `0,/RE/` range rewrites only its first `^version` line.
pre_bump_hooks = [
    "sed -i '0,/^version/{s/^version.*/version = \"{{version}}\"/}' rust/Cargo.toml",
    "cargo update --workspace --manifest-path rust/Cargo.toml",
]

post_bump_hooks = [
    "git push origin HEAD:main",
    "git push origin v{{version}}",
]

# A circuit made cheaper (`perf:`) is refrozen under new versions and keys, and its packs are
# published with the release, so it releases a patch.
[commit_types]
# A dependency or toolchain move (`build:`) changes what consumers link against, so it releases a
# patch like a fix.
build = { changelog_title = "Build", bump_patch = true }
perf = { changelog_title = "Performance", bump_patch = true }

[changelog]
path = "CHANGELOG.md"
authors = []
