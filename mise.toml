# Toolchain pins for eid-circuits, same shape as psonet/pso-zk-circuits.
# `mise run install:zk-toolchain` installs nargo and bb; every task documents
# the raw command for non-mise users.

[tools]
# S3 client for uploads to the circuits R2 bucket (packs:publish-r2).
aws-cli = "2"

[env]
# The Noir release every package is compiled and tested with.
NOIR_VERSION = "1.0.0-rc.3"
# Barretenberg for gates, verification keys and Chonk proofs: the nightly
# built on exactly NOIR_VERSION's commit (bbup has no mapping past beta.22).
# A bb bump changes every verification key and the proof format: proofs of
# one version don't verify with another (docs/FOLDING.md).
BB_VERSION = "7.0.0-nightly.20260927"
# Per-version toolchain directories, so this repository never replaces the
# nargo or bb that other projects use from ~/.nargo and ~/.bb.
NARGO_HOME = "{{env.HOME}}/.toolchains/noir-{{env.NOIR_VERSION}}"
BB_PATH = "{{env.HOME}}/.toolchains/bb-{{env.BB_VERSION}}"
NARGO = "{{env.NARGO_HOME}}/bin/nargo"
BB = "{{env.BB_PATH}}/bb"

[tasks."install:noir"]
description = "Install nargo $NOIR_VERSION into $NARGO_HOME (no shell profile changes)"
shell = "bash -c"
run = '''
set -euo pipefail
mkdir -p "$NARGO_HOME/bin"
if [ ! -x "$NARGO_HOME/bin/noirup" ]; then
  curl -fsSL https://raw.githubusercontent.com/noir-lang/noirup/main/noirup -o "$NARGO_HOME/bin/noirup"
  chmod +x "$NARGO_HOME/bin/noirup"
fi
"$NARGO_HOME/bin/noirup" --version "$NOIR_VERSION"
'''

[tasks."install:bb"]
description = "Install Barretenberg bb $BB_VERSION into $BB_PATH (no shell profile changes)"
shell = "bash -c"
run = '''
set -euo pipefail
if [ -x "$BB" ] && [ "$("$BB" --version)" = "$BB_VERSION" ]; then exit 0; fi
case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) platform=arm64-darwin ;;
  Darwin-x86_64) platform=amd64-darwin ;;
  Linux-x86_64) platform=amd64-linux ;;
  Linux-aarch64) platform=arm64-linux ;;
  *) echo "unsupported platform $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac
mkdir -p "$BB_PATH"
curl -fsSL "https://github.com/AztecProtocol/barretenberg/releases/download/v$BB_VERSION/barretenberg-$platform.tar.gz" | tar xz -C "$BB_PATH"
"$BB" --version
'''

[tasks."install:zk-toolchain"]
description = "Install nargo + bb at the pinned versions"
depends = ["install:noir", "install:bb"]

[tasks."compile"]
description = "Compile every Noir package of the workspace into target/ (over an hour)"
run = '"$NARGO" compile --workspace --silence-warnings'

[tasks."circuit-sizes"]
description = "Refresh docs/data/circuit-sizes.json (compiles the workspace; bb gates only for changed bytecode)"
run = "python3 .github/scripts/circuit_sizes.py collect . --nargo $NARGO --bb $BB --cache docs/data/circuit-sizes.json -o docs/data/circuit-sizes.json"

# The noir-zk CLI at the revision rust/Cargo.toml pins (one source of truth),
# in its own toolchain directory.
# TODO(release): once noir-zk 0.3.0 is on crates.io, rust/Cargo.toml pins
# `=0.3.0` and this installs `noir-zk-cli --version =0.3.0` again.
[tasks."install:noir-zk"]
description = "Install the noir-zk CLI at the git revision rust/Cargo.toml pins"
shell = "bash -c"
run = '''
set -euo pipefail
rev="$(sed -nE 's/^noir-zk-core = .*rev = "([^"]+)".*/\1/p' rust/Cargo.toml | head -1)"
root="$HOME/.toolchains/noir-zk-$rev"
[ -x "$root/bin/noir-zk" ] || cargo install --locked --git https://github.com/zk-experiments/noir-zk --rev "$rev" noir-zk-cli --root "$root"
ln -sf "$root/bin/noir-zk" "$HOME/.toolchains/noir-zk-current"
'''

[tasks."freeze"]
description = "Freeze changed circuits into rust/eid-circuits as eid-circuits@<version> (add -- --abi-change for ABI changes, -- --check to only compare)"
depends = ["install:noir-zk"]
shell = "bash -c"
run = '''
set -euo pipefail
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
"$HOME/.toolchains/noir-zk-current" freeze --target target --out rust/eid-circuits --assets target/release-assets \
  --library "eid-circuits@$version" --exclude bench_ "$@"
'''

# The fold test: every chain of noir/circuits/chains.json folded through
# noir-zk's kernels in the test-only pipeline [dsc, sod, document], proven
# and verified in-process (rust/eid-circuits/tests/fold.rs). It reads the
# compiled artifacts in target/ (EID_TARGET) or a release-asset directory
# (EID_ASSETS) and needs the SRS noir-zk pins (mise run srs).
[tasks."test:fold"]
description = "Fold, prove and verify every sample chain with noir-zk's kernels (needs the samples compiled in target/ and ~/.bb-crs)"
run = "cd rust && EID_TARGET=${EID_TARGET:-$PWD/../target} cargo test --release -p eid-circuits --test fold -- --nocapture"

[tasks."fold:record"]
description = "Measure the sample chains' folds at 4 and all threads into docs/data/fold-times.json (never in CI)"
shell = "bash -c"
run = '''
set -euo pipefail
threads="$(sysctl -n hw.ncpu 2>/dev/null || nproc)"
cd rust
EID_TARGET="$PWD/../target" EID_RECORD="$PWD/../docs/data/fold-times.json" EID_THREADS="4,$threads" \
  EID_MACHINE="${EID_MACHINE:-$(uname -m), $(uname -s)}" \
  cargo test --release -p eid-circuits --test fold -- --nocapture
'''

# Circuit packs: `common` and one per key family (rust/eid-circuits/circuits/
# packs.toml), each a self-contained <pack>@<version>.tar.gz (bytecode, keys,
# ABIs, manifest entries), plus catalog@<version>.json (the index). The
# version is the release's (rust/Cargo.toml),
# so run these on a release tag; CI does on every release. The circuits bucket
# serves them at https://circuits.zk-eid.dev/.
[tasks."srs"]
description = "Provision the SRS noir-zk pins in ~/.bb-crs: 2^20+1 BN254 points from Aztec's CRS host, 2^15 Grumpkin points from resources/srs"
shell = "bash -c"
run = '''
set -euo pipefail
crs="$HOME/.bb-crs"
mkdir -p "$crs"
# Grumpkin: bb generates grumpkin_g1_v2.flat.dat from a fixed generator when it
# first proves a Chonk stack; the 2 MB prefix noir-zk pins (SHA-256 72b8cdad...)
# is committed so nothing has to be proven to get it.
cp -n resources/srs/grumpkin_g1_v2.flat.dat "$crs/" 2>/dev/null || true
# BN254: bb fetches only the points a circuit needs; noir-zk loads a fixed
# 2^20+1. Take that prefix of bb's own compressed file and expand it.
points=$(( (1 << 20) + 1 ))
if [ "$(wc -c < "$crs/bn254_g1.dat" 2>/dev/null || echo 0)" -lt $(( points * 64 )) ]; then
  curl -fsS -r 0-$(( points * 32 - 1 )) -o "$crs/bn254_g1_compressed.full" http://crs.aztec-cdn.foundation/g1_compressed.dat
  python3 scripts/bn254_srs.py "$crs/bn254_g1_compressed.full" "$crs/bn254_g1.dat" "$points"
  rm -f "$crs/bn254_g1_compressed.full"
fi
ls -l "$crs"
'''

[tasks."packs"]
description = "Build target/packs: every circuit pack and the key tree, for this release's version"
depends = ["install:noir-zk"]
shell = "bash -c"
run = '''
set -euo pipefail
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
rm -rf target/packs
"$HOME/.toolchains/noir-zk-current" pack --out rust/eid-circuits --assets target/release-assets \
  --packs rust/eid-circuits/circuits/packs.toml --dest target/packs --version "$version"
'''

[tasks."packs:publish"]
description = "Upload target/packs to this version's GitHub release (v<version>)"
shell = "bash -c"
run = '''
set -euo pipefail
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
have="$(gh release view "v$version" --json assets -q '.assets[].name')"
for f in target/packs/*; do
  grep -qxF "$(basename "$f")" <<<"$have" || gh release upload "v$version" "$f"
done
'''

[tasks."packs:publish-r2"]
description = "Upload target/packs to the circuits R2 bucket (R2_CIRCUITS_BUCKET, R2_CIRCUITS_TOKEN, R2_ACCOUNT_ID)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${R2_CIRCUITS_BUCKET:?set R2_CIRCUITS_BUCKET}" "${R2_CIRCUITS_TOKEN:?set R2_CIRCUITS_TOKEN}" "${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}"
# The token is scoped to the circuits bucket, which only R2's S3 API honours:
# its S3 credentials are the token's id and the SHA-256 of its value
# (Cloudflare's documented derivation).
id=""
for url in "https://api.cloudflare.com/client/v4/accounts/$R2_ACCOUNT_ID/tokens/verify" \
           "https://api.cloudflare.com/client/v4/user/tokens/verify"; do
  id="$(curl -fsS -H "Authorization: Bearer $R2_CIRCUITS_TOKEN" "$url" | jq -r '.result.id // empty' || true)"
  [ -n "$id" ] && break
done
[ -n "$id" ] || { echo "R2_CIRCUITS_TOKEN doesn't verify with Cloudflare" >&2; exit 1; }
export AWS_ACCESS_KEY_ID="$id"
AWS_SECRET_ACCESS_KEY="$(printf '%s' "$R2_CIRCUITS_TOKEN" | shasum -a 256 | cut -d' ' -f1)"
export AWS_SECRET_ACCESS_KEY AWS_DEFAULT_REGION=auto
export AWS_REQUEST_CHECKSUM_CALCULATION=when_required AWS_RESPONSE_CHECKSUM_VALIDATION=when_required
endpoint="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
put() {
  aws s3 cp "$1" "s3://$R2_CIRCUITS_BUCKET/$2" --endpoint-url "$endpoint" --only-show-errors \
    --content-type "$3" --cache-control "$4"
}
# Versioned files never change; catalog.json (the latest release's catalog)
# goes last, so it only ever lists files already uploaded.
for f in target/packs/*; do
  case "$f" in
    *.tar.gz) put "$f" "$(basename "$f")" application/gzip "public, max-age=31536000, immutable" ;;
    *) put "$f" "$(basename "$f")" application/json "public, max-age=31536000, immutable" ;;
  esac
done
put "target/packs/catalog@$version.json" catalog.json application/json "public, max-age=300"
'''

[tasks."test:prove"]
description = "Fold, prove and verify every chain against a release-asset directory (target/release-assets or EID_ASSETS), the pins checked on the way"
run = "cd rust && EID_ASSETS=${EID_ASSETS:-$PWD/../target/release-assets} cargo test --release -p eid-circuits --test fold -- --nocapture"
