# Toolchain pins for eid-circuits, same shape as psonet/pso-zk-circuits.
# `mise run install:zk-toolchain` installs nargo and bb; every task documents
# the raw command for non-mise users.

[tools]
# Cloudflare's CLI, for uploads to the circuits R2 bucket (packs:publish-r2).
node = "22"
"npm:wrangler" = "4"

[env]
# The Noir release every package is compiled and tested with.
NOIR_VERSION = "1.0.0-rc.3"
# Barretenberg for gates, verification keys and Chonk proofs: the nightly
# built on exactly NOIR_VERSION's commit (bbup has no mapping past beta.22).
# A bb bump changes every verification key and the proof format: proofs of
# one version don't verify with another (docs/FOLDING.md).
BB_VERSION = "7.0.0-nightly.20260927"
# Per-version toolchain directories, so this repository never replaces the
# nargo or bb that other projects use from ~/.nargo and ~/.bb.
NARGO_HOME = "{{env.HOME}}/.toolchains/noir-{{env.NOIR_VERSION}}"
BB_PATH = "{{env.HOME}}/.toolchains/bb-{{env.BB_VERSION}}"
NARGO = "{{env.NARGO_HOME}}/bin/nargo"
BB = "{{env.BB_PATH}}/bb"

[tasks."install:noir"]
description = "Install nargo $NOIR_VERSION into $NARGO_HOME (no shell profile changes)"
shell = "bash -c"
run = '''
set -euo pipefail
mkdir -p "$NARGO_HOME/bin"
if [ ! -x "$NARGO_HOME/bin/noirup" ]; then
  curl -fsSL https://raw.githubusercontent.com/noir-lang/noirup/main/noirup -o "$NARGO_HOME/bin/noirup"
  chmod +x "$NARGO_HOME/bin/noirup"
fi
"$NARGO_HOME/bin/noirup" --version "$NOIR_VERSION"
'''

[tasks."install:bb"]
description = "Install Barretenberg bb $BB_VERSION into $BB_PATH (no shell profile changes)"
shell = "bash -c"
run = '''
set -euo pipefail
if [ -x "$BB" ] && [ "$("$BB" --version)" = "$BB_VERSION" ]; then exit 0; fi
case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) platform=arm64-darwin ;;
  Darwin-x86_64) platform=amd64-darwin ;;
  Linux-x86_64) platform=amd64-linux ;;
  Linux-aarch64) platform=arm64-linux ;;
  *) echo "unsupported platform $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac
mkdir -p "$BB_PATH"
curl -fsSL "https://github.com/AztecProtocol/barretenberg/releases/download/v$BB_VERSION/barretenberg-$platform.tar.gz" | tar xz -C "$BB_PATH"
"$BB" --version
'''

[tasks."install:zk-toolchain"]
description = "Install nargo + bb at the pinned versions"
depends = ["install:noir", "install:bb"]

[tasks."compile"]
description = "Compile every Noir package of the workspace into target/ (over an hour)"
run = '"$NARGO" compile --workspace --silence-warnings'

[tasks."vk-tree"]
description = "Refresh noir/circuits/vk-tree.json (run after circuit-sizes; bb write_vk only for changed bytecode)"
run = "cd rust && cargo run -q --release -p eid-vectors -- vk-tree --bb $BB"

[tasks."circuit-sizes"]
description = "Refresh docs/data/circuit-sizes.json (compiles the workspace; bb gates only for changed bytecode)"
run = "python3 .github/scripts/circuit_sizes.py collect . --nargo $NARGO --bb $BB --cache docs/data/circuit-sizes.json -o docs/data/circuit-sizes.json"

# The noir-zk CLI at the rev rust/Cargo.toml pins (one source of truth), in
# its own toolchain directory.
[tasks."install:noir-zk"]
description = "Install the noir-zk CLI at the tag or rev rust/Cargo.toml pins"
shell = "bash -c"
run = '''
set -euo pipefail
pin="$(sed -nE 's/.*noir-zk", (tag|rev) = "([^"]*)".*/\1 \2/p' rust/Cargo.toml | head -1)"
kind="${pin%% *}"; value="${pin#* }"
root="$HOME/.toolchains/noir-zk-$value"
[ -x "$root/bin/noir-zk" ] || \
  cargo install --locked --git https://github.com/zk-experiments/noir-zk "--$kind" "$value" noir-zk-cli --root "$root"
ln -sf "$root/bin/noir-zk" "$HOME/.toolchains/noir-zk-current"
'''

[tasks."freeze"]
description = "Freeze changed circuits into rust/eid-circuits (after vk-tree; add -- --abi-change for ABI changes, -- --check to only compare)"
depends = ["install:noir-zk"]
run = "$HOME/.toolchains/noir-zk-current freeze --target target --vk-tree noir/circuits/vk-tree.json --out rust/eid-circuits --assets target/release-assets --exclude bench_"

# Circuit packs: `common` and one per key family (rust/eid-circuits/circuits/
# packs.toml), each a self-contained <pack>@<version>.tar.gz (bytecode, keys,
# ABIs, key tree, manifest entries), plus catalog@<version>.json (the index)
# and vk-tree@<version>.json. The version is the release's (rust/Cargo.toml),
# so run these on a release tag; CI does on every release. The circuits bucket
# serves them at https://circuits.zk-eid.dev/.
[tasks."packs"]
description = "Build target/packs: every circuit pack and the key tree, for this release's version"
depends = ["install:noir-zk"]
shell = "bash -c"
run = '''
set -euo pipefail
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
rm -rf target/packs
"$HOME/.toolchains/noir-zk-current" pack --out rust/eid-circuits --assets target/release-assets \
  --packs rust/eid-circuits/circuits/packs.toml --dest target/packs --version "$version"
cp rust/eid-circuits/resources/vk-tree.json "target/packs/vk-tree@$version.json"
'''

[tasks."packs:publish"]
description = "Upload target/packs to this version's GitHub release (v<version>)"
shell = "bash -c"
run = '''
set -euo pipefail
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
have="$(gh release view "v$version" --json assets -q '.assets[].name')"
for f in target/packs/*; do
  grep -qxF "$(basename "$f")" <<<"$have" || gh release upload "v$version" "$f"
done
'''

[tasks."packs:publish-r2"]
description = "Upload target/packs to the circuits R2 bucket (R2_CIRCUITS_BUCKET, R2_CIRCUITS_TOKEN, R2_ACCOUNT_ID)"
shell = "bash -c"
run = '''
set -euo pipefail
: "${R2_CIRCUITS_BUCKET:?set R2_CIRCUITS_BUCKET}" "${R2_CIRCUITS_TOKEN:?set R2_CIRCUITS_TOKEN}" "${R2_ACCOUNT_ID:?set R2_ACCOUNT_ID}"
export CLOUDFLARE_API_TOKEN="$R2_CIRCUITS_TOKEN" CLOUDFLARE_ACCOUNT_ID="$R2_ACCOUNT_ID"
version="$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)"
put() {
  wrangler r2 object put "$R2_CIRCUITS_BUCKET/$2" --file "$1" --remote \
    --content-type "$3" --cache-control "$4"
}
# Versioned files never change; catalog.json (the latest release's catalog)
# goes last, so it only ever lists files already uploaded.
for f in target/packs/*; do
  case "$f" in
    *.tar.gz) put "$f" "$(basename "$f")" application/gzip "public, max-age=31536000, immutable" ;;
    *) put "$f" "$(basename "$f")" application/json "public, max-age=31536000, immutable" ;;
  esac
done
put "target/packs/catalog@$version.json" catalog.json application/json "public, max-age=300"
'''

[tasks."test:prove"]
description = "Prove and verify every chain with the frozen registry (needs target/release-assets or EID_ASSETS)"
run = "cd rust && EID_ASSETS=${EID_ASSETS:-$PWD/../target/release-assets} cargo test --release -p eid-circuits"
