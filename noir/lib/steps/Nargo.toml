[package]
name = "eid_steps"
type = "lib"
authors = ["zk-experiments"]
compiler_version = ">=1.0.0"

[dependencies]
csca_registry = { tag = "v0.3.1", git = "https://github.com/zk-experiments/csca-registry", directory = "noir/csca_registry" }
eid_der = { path = "../der" }
# The channel payload commitment the document step leaves for an envelope app (zk-encryption).
channel = { tag = "v0.1.0", git = "https://github.com/zk-experiments/zk-encryption", directory = "noir/lib/channel" }
# Only the tests hash; circuits hash in their generated binaries.
eid_hash = { path = "../hash" }
