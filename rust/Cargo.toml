[workspace]
members = ["eid-prover", "eid-vectors", "eid-circuits"]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# Certificate parsing and signature schemes come from the registry itself, so
# vectors are built from exactly what the registry verified.
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
sha2 = "0.10"
sha1 = "0.10"
# Mock DSC keys and signatures for the SOD step vectors (test data only).
rsa = "0.9"
rand_chacha = "0.3"
serde_json = "1.0"
toml = "0.9"
eid-prover = { path = "eid-prover" }
# Proving: layered registries and generated bindings (core, codegen), witness
# solving, the generic pipeline kernels and Chonk (backend). The rev is
# noir-zk's `feat/pipelines` branch, which pins Noir and bb (its mise.toml).
# TODO(release): switch to `=0.3.0` from crates.io before the v0.8.0 release
# (mise.toml's install:noir-zk and the README say the same).
noir-zk-core = { git = "https://github.com/zk-experiments/noir-zk", rev = "dd2d33f" }
noir-zk-backend = { git = "https://github.com/zk-experiments/noir-zk", rev = "dd2d33f" }
noir-zk-codegen = { git = "https://github.com/zk-experiments/noir-zk", rev = "dd2d33f" }
ark-ff = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unimplemented = "deny"
exit = "deny"
panic = "warn"
unwrap_used = "warn"

# Registry building and signature checks are slow unoptimised (brainpoolP512r1
# uses the crypto-bigint backend); optimise dependencies in dev/test builds.
[profile.dev.package."*"]
opt-level = 3
