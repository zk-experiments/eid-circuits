[workspace]
members = ["eid-envelope", "eid-prover", "eid-vectors", "eid-circuits"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
publish = false

[workspace.dependencies]
# Certificate parsing and signature schemes come from the registry itself, so
# vectors are built from exactly what the registry verified.
csca-registry = { git = "https://github.com/zk-experiments/csca-registry", tag = "v0.3.1" }
anyhow = "1.0"
clap = { version = "4", features = ["derive"] }
hex = "0.4"
num-bigint = "0.4"
sha2 = "0.10"
sha1 = "0.10"
# Mock DSC keys and signatures for the SOD step vectors (test data only).
rsa = "0.9"
rand_chacha = "0.3"
serde_json = "1.0"
# Envelope encryption (Grumpkin KEM + Poseidon2 duplex), shared with the circuits.
eid-envelope = { path = "eid-envelope" }
eid-prover = { path = "eid-prover" }
pso-poseidon = "0.5"
# Proving: generated bindings (codegen), witness solving and Chonk (backend).
# The rev pins Noir and bb together (noir-zk's mise.toml).
noir-zk-core = { git = "https://github.com/zk-experiments/noir-zk", rev = "3b4d534e4ebdfefa0ab396dac7c8b936a09fb225" }
noir-zk-backend = { git = "https://github.com/zk-experiments/noir-zk", rev = "3b4d534e4ebdfefa0ab396dac7c8b936a09fb225" }
noir-zk-codegen = { git = "https://github.com/zk-experiments/noir-zk", rev = "3b4d534e4ebdfefa0ab396dac7c8b936a09fb225" }
ark-bn254 = "0.6"
ark-ec = "0.6"
ark-ff = "0.6"
ark-grumpkin = "0.6"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
unimplemented = "deny"
exit = "deny"
panic = "warn"
unwrap_used = "warn"

# Registry building and signature checks are slow unoptimised (brainpoolP512r1
# uses the crypto-bigint backend); optimise dependencies in dev/test builds.
[profile.dev.package."*"]
opt-level = 3
