# cargo-deny configuration for the Rust tools. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin (rsa, via csca-registry): private-key timing leak. The tools only
  # verify signatures with public keys.
  { id = "RUSTSEC-2023-0071", reason = "public-key verification only; no private-key operations" },
]

[bans]
# Warn: csca-registry's graph mixes the digest 0.10 (arkworks, rsa 0.9) and
# 0.11 (RustCrypto 0.14 curves) lines; see csca-registry/deny.toml.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[licenses]
version = 2
confidence-threshold = 0.93
private = { ignore = true }
unused-allowed-license = "warn"
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/zk-experiments/csca-registry"]
