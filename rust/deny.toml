# cargo-deny configuration for the Rust tools. Run with `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Marvin (rsa): private-key timing leak. Verification uses public keys only;
  # the one private-key use signs synthetic test documents with fixed,
  # published mock keys (eid-vectors/src/mock.rs), so there is nothing to leak.
  { id = "RUSTSEC-2023-0071", reason = "private keys are public mock test keys; no secrets" },
]

[bans]
# Warn: csca-registry's graph mixes the digest 0.10 (arkworks, rsa 0.9) and
# 0.11 (RustCrypto 0.14 curves) lines; see csca-registry/deny.toml.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
deny = [{ name = "openssl" }, { name = "openssl-sys" }]

[licenses]
version = 2
confidence-threshold = 0.93
private = { ignore = true }
unused-allowed-license = "warn"
# ISC and CDLA-Permissive-2.0: rustls, ring and webpki-roots (eid-circuits feature `http`).
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "Unicode-3.0", "ISC", "CDLA-Permissive-2.0"]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/zk-experiments/csca-registry",
  "https://github.com/zk-experiments/noir-zk",
  "https://github.com/noir-lang/noir",
]
