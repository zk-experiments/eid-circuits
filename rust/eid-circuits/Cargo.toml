[package]
name = "eid-circuits"
description = "The identity layer for noir-zk pipelines: eid-circuits' frozen DSC, SOD and document steps as a layered registry (families eid/dsc, eid/sod, eid/document with their roots and typed bindings), proven with noir-zk's generic kernels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
noir-zk-core.workspace = true
noir-zk-backend.workspace = true
hex.workspace = true

[build-dependencies]
noir-zk-codegen.workspace = true
# Feature `bundled`: compile and check circuits at build time.
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
toml.workspace = true

[dev-dependencies]
noir-zk-core.workspace = true
noir-zk-backend.workspace = true
csca-registry.workspace = true
ark-ff.workspace = true
hex.workspace = true
serde_json.workspace = true
toml.workspace = true

[features]
# Fetch bytecode release assets over HTTPS.
http = ["noir-zk-backend/http"]
# Compile circuits from the shipped Noir source at build time and embed them
# (build.rs: needs the pinned nargo; EID_CIRCUITS_BUNDLE picks the packs).
bundled = []
# Unpack downloaded circuit packs (noir_zk_backend::pack).
packs = ["noir-zk-backend/packs"]

[lints]
workspace = true
