[library]
name = "eid-circuits"
version = "0.8.0"

# ------------------------------------------------------------ families (hand-written; freeze keeps them)
# The identity layer's families, for a combining registry's pipelines
# (noir-zk's layered registries): the links chain c_A (DSC -> SOD) and c_B
# (SOD -> document), and the document step leaves DG1's payload commitment
# (`PayloadCommitment`, noir-zk's shared link vocabulary) for an envelope app.

# Step A: [registry_root, c_A]; the registry root is public.
[[family]]
layer = "eid"
name = "dsc"
members = ["dsc_*"]
link_out = { index = 1, link = "CA" }
public_from = 0
slots = ["registry_root"]

# Step B: [c_A, c_B]; nothing public.
[[family]]
layer = "eid"
name = "sod"
members = ["sod_*"]
link_in = { index = 0, link = "CA" }
link_out = { index = 1, link = "CB" }
public_from = 0
slots = []

# Step C: [c_B, payload_commitment, date, scope, nullifier]; date, scope and the nullifier are public.
[[family]]
layer = "eid"
name = "document"
members = ["document_*"]
link_in = { index = 0, link = "CB" }
link_out = { index = 1, link = "PayloadCommitment" }
public_from = 2
slots = ["date", "scope", "nullifier"]
